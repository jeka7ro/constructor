<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Roboto+Slab:wght@700&family=Arvo:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 512px;
      height: 512px;
      background-color: transparent;
    }
    .icon-box {
      width: 400px;
      height: 400px;
      background-color: #2F3841; /* Matches the dark slate grey in the image */
      border-radius: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .logo {
      font-family: 'Courier', 'Courier Prime', 'Roboto Slab', serif;
      font-weight: 700;
      font-size: 210px;
      color: #F8FAFC;
      letter-spacing: -10px;
      display: flex;
      align-items: baseline;
      padding-bottom: 20px;
      padding-right: 15px;
    }
    .dot {
      color: #34D399; /* Emerald/Mint green */
      font-size: 240px;
      margin: 0 8px;
      font-family: sans-serif;
      font-weight: 900;
    }
    .a-letter {
      font-family: 'Courier', 'Courier Prime', 'Roboto Slab', serif;
      font-weight: 700;
      font-size: 210px;
      color: #F8FAFC;
    }
  </style>
</head>
<body>
  <div class="icon-box">
    <div class="logo">
      d<span class="dot">.</span><span class="a-letter">a</span>
    </div>
  </div>
</body>
</html>
